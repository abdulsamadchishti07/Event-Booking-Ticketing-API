[project]
name = "Event-Booking-Ticketing-API"
version = "0.1.0"
description = "Users can browse events, reserve seats/tickets, and pay. Seller can create events with limited seat capacity."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.14.0",
    "fastapi[standard]>=0.115.0",
    "psycopg2-binary>=2.9.9",
    "pwdlib[argon2]>=0.2.0",
    "pyjwt>=2.8.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.30",
    "stripe>=16.0.0,<17.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
exclude-newer = "2026-10-10T00:00:00Z"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = "."
