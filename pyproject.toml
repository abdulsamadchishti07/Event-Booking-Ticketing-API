[project]
name = "Event-Booking-Ticketing-API"
version = "0.1.0"
description = "Users can browse events, reserve seats/tickets, and pay. Seller can create events with limited seat capacity."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.19.0",
    "fastapi[standard]==0.139.2",
    "httpx==0.28.1",
    "psycopg2-binary==2.9.12",
    "pwdlib[argon2,bcrypt]==0.2.1",
    "pydantic-settings==2.14.2",
    "pydantic[email]==2.13.4",
    "pytest==9.1.1",
    "python-dotenv==1.2.2",
    "python-jose[cryptography]==3.5.0",
    "python-multipart==0.0.32",
    "redis==8.1.0",
    "sqlalchemy==2.0.51",
    "uvicorn[standard]==0.51.0",
]
