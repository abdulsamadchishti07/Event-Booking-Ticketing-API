services:
  # ============================================================================
  # 1. PostgreSQL 16 Relational Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: event_booking_postgres
    restart: unless-stopped
    command: postgres -c max_connections=250
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: event_booking_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d event_booking_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # ============================================================================
  # 2. Redis 7.2 In-Memory Cache, Rate Limiter & Job Queue
  # ============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: event_booking_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # ============================================================================
  # 3. App Server 1 (Migration Leader & Uvicorn Node)
  # ============================================================================
  web1:
    build:
      context: .
      dockerfile: Dockerfile
    image: event-booking-api:latest
    container_name: event_booking_web1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &app-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-event_booking_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY environment variable is required and must be set in .env}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      ENVIRONMENT: production
      TRUSTED_PROXIES: 127.0.0.1,::1,localhost,testclient,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
      RUN_MIGRATIONS: "true"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SERVICES_RATE_LIMIT: ${SERVICES_RATE_LIMIT:-120}
      BOOKINGS_RATE_LIMIT: ${BOOKINGS_RATE_LIMIT:-60}
      PAYMENTS_RATE_LIMIT: ${PAYMENTS_RATE_LIMIT:-60}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-100}
      MAX_CONCURRENT_AUTH_HASHES: ${MAX_CONCURRENT_AUTH_HASHES:-10}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-25}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-25}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-10}
      RATE_LIMIT_FAIL_CLOSED: ${RATE_LIMIT_FAIL_CLOSED:-false}
      EMAIL_SMTP_SERVER: ${EMAIL_SMTP_SERVER:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@booking.abdulsamadchishti.dev}
    healthcheck: &app-healthcheck
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/\")'"]
      interval: 5s
      timeout: 3s
      retries: 5
    expose:
      - "8000"
    networks:
      - app_network

  # ============================================================================
  # 4. App Server 2 (Uvicorn Worker Node - Follower)
  # ============================================================================
  web2:
    image: event-booking-api:latest
    container_name: event_booking_web2
    restart: unless-stopped
    depends_on:
      web1:
        condition: service_healthy
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
    healthcheck: *app-healthcheck
    expose:
      - "8000"
    networks:
      - app_network

  # ============================================================================
  # 5. App Server 3 (Uvicorn Worker Node - Follower)
  # ============================================================================
  web3:
    image: event-booking-api:latest
    container_name: event_booking_web3
    restart: unless-stopped
    depends_on:
      web1:
        condition: service_healthy
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
    healthcheck: *app-healthcheck
    expose:
      - "8000"
    networks:
      - app_network

  # ============================================================================
  # 6. Asynchronous Background Job Worker (Emails, Invoices, QR codes)
  # ============================================================================
  worker:
    image: event-booking-api:latest
    container_name: event_booking_worker
    restart: unless-stopped
    command: python -m app.workers.worker
    depends_on:
      web1:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
    healthcheck:
      disable: true
    networks:
      - app_network

  # ============================================================================
  # 7. Nginx Least-Connected Load Balancer with Failover Gateway
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: event_booking_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web1:
        condition: service_healthy
      web2:
        condition: service_healthy
      web3:
        condition: service_healthy
    networks:
      - app_network

volumes:
  postgres_data:
  redis_data:

networks:
  app_network:
    driver: bridge
