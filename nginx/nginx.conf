upstream fastapi_upstream {
    least_conn;
    server web1:8000 max_fails=3 fail_timeout=10s;
    server web2:8000 max_fails=3 fail_timeout=10s;
    server web3:8000 max_fails=3 fail_timeout=10s;
    keepalive 128;
}

server {
    listen 80;
    server_name localhost;

    # Client payload & timeout limits
    client_max_body_size 10M;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Gzip Compression for high-throughput JSON and text
    gzip on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        text/plain
        text/css;
    gzip_vary on;

    # Forward to FastAPI Uvicorn worker pool
    location / {
        proxy_pass http://fastapi_upstream;
        proxy_http_version 1.1;

        # Connection reuse
        proxy_set_header Connection "";

        # Standard client IP forwarding headers (enforce remote_addr to prevent header spoofing)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Upstream-Addr $upstream_addr always;

        # Transparent failover: on error, timeout, or 5xx, immediately retry next healthy server
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;

        # Proxy timeouts (fast connect timeout enables rapid failover)
        proxy_connect_timeout 2s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }
}
