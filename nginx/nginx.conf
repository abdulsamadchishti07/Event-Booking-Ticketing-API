upstream fastapi_upstream {
    least_conn;
    server web1:8000 max_fails=3 fail_timeout=10s;
    server web2:8000 max_fails=3 fail_timeout=10s;
    server web3:8000 max_fails=3 fail_timeout=10s;
    keepalive 128;
}

server {
    listen 80;
    server_name localhost;

    # Client payload & timeout limits
    client_max_body_size 10M;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Gzip Compression for high-throughput JSON and text
    gzip on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        text/plain
        text/css;
    gzip_vary on;

    # Cloudflare Real IP resolution
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Forward to FastAPI Uvicorn worker pool
    location / {
        proxy_pass http://fastapi_upstream;
        proxy_http_version 1.1;

        # Connection reuse
        proxy_set_header Connection "";

        # Standard client IP forwarding headers (enforce remote_addr to prevent header spoofing)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        add_header X-Upstream-Addr $upstream_addr always;

        # Transparent failover: on error, timeout, or 5xx, immediately retry next healthy server
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;

        # Proxy timeouts (fast connect timeout enables rapid failover)
        proxy_connect_timeout 2s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }
}
